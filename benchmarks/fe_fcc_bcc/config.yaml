# Fe BCC/FCC synthetic 4D-STEM benchmark: fixed v1 conditions.
# See README.md for the coordinate contract and the recorded deviations
# from docs/Fe_FCC_BCC_4DSTEM_MVP_PLAN.md.
version: 1.0
geometry:
  detector_shape: [256, 256]
  center_px: [127.5, 127.5]            # (row, col); pixel (127,127) edges, i.e. center between pixels
  reciprocal_sampling_A_per_px: 0.020
  s_y: +1                              # q_y = s_y * (row - c_y) * dq
  voltage_kv: 300
detector_window:
  q_min_A: 0.25                        # 12.5 px: outside pipeline peaks.exclusion_radius (8 px)
  q_max_A: 2.30                        # 115.0 px: inside pipeline peaks.max_radius (120 px)
  edge_margin_px: 4                    # matches pipeline detector border exclusion
  min_spot_spacing_px: 6               # >= pipeline minimum_spacing (5) so peaks resolve
peak_kernel:
  sigma_px: 1.0                        # fixed 2D Gaussian for the direct beam and every spot
intensity:
  direct_beam_amplitude: 3500.0
  strong_spot_amplitude: 1200.0        # amplitude of the strongest spot (intensity_norm = 1)
  spot_min_relative: 0.25              # weakest retained spot >= 300 counts (>=10x the ~28-count
                                       # detection floor: 0.008 x direct-beam signal, background
                                       # subtracted per find_pattern_peaks)
  spot_min_amplitude: 300.0            # >= pipeline matching.minimum_peak_intensity (30) with margin
  max_count_limit: 4094                # stay below the pipeline invalid_count clipping trigger
simulator:
  package: pymatgen
  calculator: TEMCalculator
  camera_length_cm: 160                # recorded for traceability; q is computed from hkl, not Position
  extinction_floor: 1.0e-12            # |F|^2 below this is treated as extinct
  intensity_note: "|F|^2 via Mott-Bethe electron scattering factors; renormalized so the strongest in-window ZOLZ spot = 1"
cifs:
  bcc: references/cifs/Fe-BCC.cif      # Im-3m #229, a=2.86303550 A (phase id 0 in the pipeline)
  fcc: references/cifs/Fe-FCC.cif      # Fm-3m #225, a=3.65555117 A (phase id 1 in the pipeline)
mib_header_source: data                # first *.mib provides the 384-byte frame header template
seeds:
  note: "v1 uses no random numbers; seeds are reserved for future noise tiers"
output_root: benchmarks/Fe_FCC_BCC_v1
datasets:
  T01:
    mib_suffix: '0001'      # quoted: YAML would parse 0001 as int 1 and break scan naming
    scan_shape: [16, 16]
    patterns:
      - {phase: Fe-BCC, zone_axis: [0, 0, 1], in_plane_deg: 0.0, region: full}
  T02:
    mib_suffix: '0002'
    scan_shape: [16, 16]
    patterns:
      - {phase: Fe-FCC, zone_axis: [0, 0, 1], in_plane_deg: 0.0, region: full}
  T03:
    mib_suffix: '0003'
    scan_shape: [32, 32]
    patterns:
      # 10 deg in-plane rotation (deviation from the original 0 deg definition):
      # at 0 deg the axial {200} spots sit exactly on pixel boundaries (beam center
      # 127.5 is a pixel corner), the 9x9 local-maximum filter flags the symmetric
      # plateau twice, and duplicate detections drop the observed-fraction gate below
      # 0.70.  See findings.md.  A rotation is physically arbitrary; it breaks only
      # the pixel-alignment degeneracy.
      - {phase: Fe-BCC, zone_axis: [0, 0, 1], in_plane_deg: 10.0, region: {rows: [0, 16], cols: [0, 16]}}
      - {phase: Fe-BCC, zone_axis: [0, 1, 1], in_plane_deg: 25.0, region: {rows: [0, 16], cols: [16, 32]}}
      - {phase: Fe-FCC, zone_axis: [0, 0, 1], in_plane_deg: 10.0, region: {rows: [16, 32], cols: [0, 16]}}
      - {phase: Fe-FCC, zone_axis: [1, 1, 1], in_plane_deg: 35.0, region: {rows: [16, 32], cols: [16, 32]}}
